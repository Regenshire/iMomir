###############################################################################
# Print Template
# Physical dimensions are in millimeters unless otherwise noted.
###############################################################################

[Template]

# Template file format version.
Schema_Version = 1

# Permanent internal ID used by saved configuration. Do not change after release.
Template_ID = borderless-3p5x5-two-card

# Name shown in template selection screens.
Display_Name = PDF ONLY - 3.5 x 5 Borderless - 2 Card Layout

# Short description of the template.
Description = Two rotated cards stacked on a borderless 3.5 x 5 inch page.

# Enables or disables this template.
Enabled = True

# True allows this template to be used by the Momir print flow.
Momir_Support = True

# True allows this template to be used by the Card Print / Chaos Draft flow.
CardPrint_Support = True


[Metadata]

Printer = Any
Printer_Model = Any
Paper_Stock = Any
Paper_Stock_Type = Any
Paper_Size = 3.5 x 5 in
Orientation = Vertical
Silhouette_Support = False
Silhouette_Model = Any
Tags = 3.5x5, Borderless, 2 Card, Rotated


[Page]

# Physical page width.
Width_mm = 88.9

# Physical page height.
Height_mm = 127.0


[Card]

# Unrotated card width.
Finished_Width_mm = 63.5

# Unrotated card height.
Finished_Height_mm = 88.9

Bleed_mm = 0.0
Slot_Width_mm = 63.5
Slot_Height_mm = 88.9
Rotation_Degrees = 0


[Layout]

# Explicit layouts define each physical card position individually.
Type = Explicit

# Logical arrangement of the explicit slots.
Columns = 1
Rows = 2


[Slot_1]

# Top card. Rotation converts the 63.5 x 88.9 card to 88.9 x 63.5.
X_mm = 0.0
Y_mm = 63.5
Width_mm = 88.9
Height_mm = 63.5
Finished_Width_mm = 63.5
Finished_Height_mm = 88.9
Rotation_Degrees = 90


[Slot_2]

# Bottom card.
X_mm = 0.0
Y_mm = 0.0
Width_mm = 88.9
Height_mm = 63.5
Finished_Width_mm = 63.5
Finished_Height_mm = 88.9
Rotation_Degrees = 90


[Rendering]

Add_Edge_Bleed_Border = False
Fill_Unused_Slots_With_White = False
Corner_Radius_mm = 0.0
Uses_Fixed_Inner_Margin = True


[Duplex]

Back_Side_Slot_Order = Same