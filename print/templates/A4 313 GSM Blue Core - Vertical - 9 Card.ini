###############################################################################
# Print Template
# Physical dimensions are in millimeters unless otherwise noted.
###############################################################################

[Template]

Schema_Version = 1
Template_ID = A4_313_GSM_Blue_Core_Vertical_9card
Display_Name = A4 313 GSM Blue Core - Vertical - 9 Card
Description = A4 portrait layout used with 313 GSM Blue such as 313 GSM / 370mic Double-Sided Inkjet Compatible Blue Cored Proxy Paper
Enabled = True
Momir_Support = False
CardPrint_Support = True


[Metadata]

Printer = Any
Printer_Model = Any
Paper_Stock = 313 GSM / 370mic Double-Sided Inkjet Compatible Blue Cored Proxy Paper
Paper_Stock_Type = Cardstock
Paper_Size = A4
Orientation = Vertical
Silhouette_Support = True
Silhouette_Model = Any
Tags = A4, Vertical, 3x3, 9 Card, Silhouette, Blue Cored, Bluecore, Crowned Cardstock


[Page]

Width_mm = 210.0
Height_mm = 297.0


[Card]

# Final physical card dimensions used for cutting.
Finished_Width_mm = 63.0
Finished_Height_mm = 88.0

# Bleed added around each finished card.
Bleed_mm = 0.5925

Slot_Width_mm = 64.185
Slot_Height_mm = 89.185
Rotation_Degrees = 0


[Layout]

Type = Grid
Columns = 3
Rows = 3

# Distance between finished card edges
Horizontal_Spacing_mm = 1.185
Vertical_Spacing_mm = 1.185

# Exact legacy slot spacing is preserved instead of recalculated.
Horizontal_Step_mm =
Vertical_Step_mm =

# Explicit origins preserve the existing registration-mark alignment.
Horizontal_Alignment = Center
Vertical_Alignment = Center
Start_X_mm =
Start_Y_mm =

# Controls the order cards are assigned to generated grid slots.
# The first card is upper-left, cards fill left-to-right, then the next row.
#
#   1  2  3  4
#   5  6  7  8
Fill_Order = Top_Left_Row_Major


[Rendering]

Add_Edge_Bleed_Border = True
Fill_Unused_Slots_With_White = True
Corner_Radius_mm = 3.25
Uses_Fixed_Inner_Margin = True


[Silhouette]

# Registration-mark background image relative to this template file.
Registration_Background = assets/SIL_A4_NINE_CARD.png


[Duplex]

# Mirror left-to-right so printed backs align with the front sheet.
#
# Same              = use the same slot positions.
# Mirror_Horizontal = mirror positions left-to-right.
# Mirror_Vertical   = mirror positions top-to-bottom.
# Reverse           = use the slot list in reverse order.
Back_Side_Slot_Order = Mirror_Horizontal