###############################################################################
# Print Template
# Physical dimensions are in millimeters unless otherwise noted.
###############################################################################

[Template]

# Template file format version.
Schema_Version = 1

# Permanent internal ID used by saved configuration. Do not change after release.
Template_ID = silhouette-a4-vertical-9

# Name shown in template selection screens.
Display_Name = A4 - Vertical - 9 Card

# Short description of the template.
Description = A4 portrait sheet containing nine 63 x 88 mm cards.

# Enables or disables this template.
Enabled = True

# True allows this template to be used by the Momir print flow.
Momir_Support = True

# True allows this template to be used by the Card Print / Chaos Draft flow.
CardPrint_Support = True


[Metadata]

# Printer manufacturer or family. Use Any when unrestricted.
Printer = Any

# Specific printer model. Use Any when unrestricted.
Printer_Model = Any

# Specific paper stock or product. Use Any when unrestricted.
Paper_Stock = Any

# General media type such as Plain, Matte, Glossy, or Cardstock.
Paper_Stock_Type = Any

# Standard paper size.
Paper_Size = A4

# Paper orientation.
Orientation = Vertical

# True indicates this template supports Silhouette registration-mark workflows.
Silhouette_Support = True

# Specific Silhouette model. Use Any when unrestricted.
Silhouette_Model = Any

# Comma-separated terms used for template searching and filtering.
Tags = A4, Vertical, 3x3, 9 Card, Silhouette


[Page]

# Physical page width.
Width_mm = 210.0

# Physical page height.
Height_mm = 297.0


[Card]

# Final card width after cutting.
Finished_Width_mm = 63.0

# Final card height after cutting.
Finished_Height_mm = 88.0

# Bleed added around each finished card.
Bleed_mm = 0.5925

# Total slot width including bleed. Leave blank to calculate from card width and bleed.
Slot_Width_mm = 64.185

# Total slot height including bleed. Leave blank to calculate from card height and bleed.
Slot_Height_mm = 89.185

# Card rotation in degrees. Supported values: 0, 90, 180, 270.
Rotation_Degrees = 0


[Layout]

# Layout type.
# Grid automatically generates slots from Rows and Columns.
# Explicit uses individually defined [Slot_1], [Slot_2], etc. sections.
Type = Grid

# Number of card columns.
Columns = 3

# Number of card rows.
Rows = 3

# Distance between finished card edges horizontally.
Horizontal_Spacing_mm = 1.185

# Distance between finished card edges vertically.
Vertical_Spacing_mm = 1.185

# Optional exact horizontal distance between slot origins.
# Leave blank to calculate from Finished_Width_mm + Horizontal_Spacing_mm.
Horizontal_Step_mm =

# Optional exact vertical distance between slot origins.
# Leave blank to calculate from Finished_Height_mm + Vertical_Spacing_mm.
Vertical_Step_mm =

# Horizontal grid alignment when Start_X_mm is blank.
# Supported values: Left, Center, Right.
Horizontal_Alignment = Center

# Vertical grid alignment when Start_Y_mm is blank.
# Supported values: Bottom, Center, Top.
Vertical_Alignment = Center

# Optional explicit X position for the grid origin. Blank uses alignment.
Start_X_mm =

# Optional explicit Y position for the grid origin. Blank uses alignment.
Start_Y_mm =

# Controls the order cards are assigned to generated grid slots.
# Top_Left_Row_Major starts at the upper-left, fills left-to-right,
# then continues on the next row.
#
# Example 3x3 order:
#   1  2  3
#   4  5  6
#   7  8  9
Fill_Order = Top_Left_Row_Major


[Rendering]

# Extends card edge pixels into bleed areas when source bleed is unavailable.
Add_Edge_Bleed_Border = True

# Draws unused card positions as white card-shaped areas.
Fill_Unused_Slots_With_White = True

# Corner radius used for generated card shapes.
Corner_Radius_mm = 3.25

# True uses the physical slot positions defined by this template.
Uses_Fixed_Inner_Margin = True


[Silhouette]

# Registration-mark background image.
# The path is relative to this template file.
Registration_Background = assets/SIL_A4_NINE_CARD.png


[Duplex]

# Controls how front-side slot positions map to the back-side page.
#
# Same              = use the same slot positions.
# Mirror_Horizontal = mirror positions left-to-right.
# Mirror_Vertical   = mirror positions top-to-bottom.
# Reverse           = use the slot list in reverse order.
Back_Side_Slot_Order = Mirror_Horizontal