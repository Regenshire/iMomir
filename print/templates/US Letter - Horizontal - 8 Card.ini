###############################################################################
# Print Template
# Physical dimensions are in millimeters unless otherwise noted.
###############################################################################

[Template]

Schema_Version = 1
Template_ID = silhouette-letter-horizontal-8
Display_Name = US Letter - Horizontal - 8 Card
Description = US Letter landscape sheet containing eight cards in a 4 x 2 layout.
Enabled = True
Momir_Support = True
CardPrint_Support = True


[Metadata]

Printer = Any
Printer_Model = Any
Paper_Stock = Any
Paper_Stock_Type = Any
Paper_Size = US Letter
Orientation = Horizontal
Silhouette_Support = True
Silhouette_Model = Any
Tags = US Letter, Horizontal, 4x2, 8 Card, Silhouette


[Page]

Width_mm = 279.4
Height_mm = 215.9


[Card]

# Final physical card dimensions used for cutting.
Finished_Width_mm = 63.0
Finished_Height_mm = 88.0

# This legacy layout has different horizontal and vertical slot bleed.
# Exact Slot_Width_mm and Slot_Height_mm below preserve that geometry.
Bleed_mm = 0.0

Slot_Width_mm = 63.6666667
Slot_Height_mm = 89.0666354
Rotation_Degrees = 0


[Layout]

Type = Grid
Columns = 4
Rows = 2

# Distance between the 63 x 88 mm finished card edges.
Horizontal_Spacing_mm = 0.6666667
Vertical_Spacing_mm = 1.0666354

# Exact legacy slot spacing is preserved instead of recalculated.
Horizontal_Step_mm = 63.6666667
Vertical_Step_mm = 89.0666354

# Explicit origins preserve the existing registration-mark alignment.
Horizontal_Alignment = Center
Vertical_Alignment = Center
Start_X_mm = 12.9166667
Start_Y_mm = 18.5166823

# Controls the order cards are assigned to generated grid slots.
# The first card is upper-left, cards fill left-to-right, then the next row.
#
#   1  2  3  4
#   5  6  7  8
Fill_Order = Top_Left_Row_Major


[Rendering]

Add_Edge_Bleed_Border = True
Fill_Unused_Slots_With_White = True
Corner_Radius_mm = 3.25
Uses_Fixed_Inner_Margin = True


[Silhouette]

# Registration-mark background image relative to this template file.
Registration_Background = assets/SIL_LETTER_HORIZONTAL.png


[Duplex]

# Mirror left-to-right so printed backs align with the front sheet.
Back_Side_Slot_Order = Mirror_Horizontal